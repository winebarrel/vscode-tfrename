name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npx vsce package --out vscode-tfrename.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-tfrename-vsix
          path: vscode-tfrename.vsix
